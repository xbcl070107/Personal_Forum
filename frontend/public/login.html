<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>bootstrap</title>
  </head>
  <body>
    <script>
      // 冒充已登录：把 token 和用户塞进 localStorage，然后跳进应用。
      // hash 里的 /home 是 404 兜底，会被重定向到真正的首页。
      localStorage.setItem('token', 'fake-token-for-screenshot')
      localStorage.setItem(
        'user',
        JSON.stringify({ id: 1, username: 'xbcl', role: 'ADMIN' }),
      )
      location.replace('/#' + (new URLSearchParams(location.search).get('to') || '/'))
    </script>
  </body>
</html>
