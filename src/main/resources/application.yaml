# ============================================================
# 这个文件会跟着 git 一起提交 —— 所以里面不能有密码。
# 数据库密码放在 application-local.yaml 里，那个文件被 .gitignore 挡住了。
# ============================================================

spring:
  application:
    name: Personal_Forum

  # 默认激活 local 这个 profile，也就是去加载 application-local.yaml。
  # 以后有生产环境了，这里改成 prod，再加一个 application-prod.yaml 就行。
  profiles:
    active: local

  # ---- 图片上传的大小限制（W2 的 /file/upload）----
  # 这一层是 Tomcat 在读请求体时就挡住的，所以「超限」根本走不到 Controller：
  # 超过 max-file-size 会抛 MaxUploadSizeExceededException（见 GlobalExceptionHandler）。
  # FileService 里也有一道 5MB 的判断，两道都要改 ——
  # 这里管的是"请求根本别进来"，那边管的是"万一改了这个配置，业务层也别放过"。
  servlet:
    multipart:
      max-file-size: 5MB        # 单个文件
      max-request-size: 10MB    # 整个 multipart 请求（预留多图上传场景）

# ---- 业务自己的配置 ----
forum:
  upload:
    # 图片存哪儿。相对路径是相对「启动时的工作目录」（用 IDE 起就是项目根目录）。
    # 这个目录不在 git 里（.gitignore 有 uploads/），换机器时是空的，重建即可。
    dir: ./uploads
    # 返回给前端的 URL 前缀。必须包含 context-path（/dev-api），
    # 否则前端拿到 /uploads/xxx.jpg 去请求会是 404 —— 真正的地址是 /dev-api/uploads/xxx.jpg
    url-prefix: /dev-api/uploads

  # ---- W6：超时关单（task/OrderTimeoutTask）----
  # 三个值都有代码里的默认值（@Value 的冒号右边），这里写出来是为了「能一眼看见、能直接改」。
  order:
    # 两轮之间隔多久（fixedDelay：上一轮跑完再等这么久，不是每这么久跑一次）
    timeout-scan-interval-ms: 60000

    # 一轮最多关多少单。积压很多时，调大能关得快些，但单轮占用的时间也变长
    timeout-batch-size: 200

    # ⚠️ 骨架期必须是 false：OrderService.closeTimeoutOrder 还是抛 501 的骨架，
    #    开着的话每分钟都会刷一条错误日志。等那个方法实现完、验收通过，再改成 true。
    timeout-scan-enabled: false

mybatis-plus:
  configuration:
    # 库里的 sort_order / created_at 自动映射到 Java 的 sortOrder / createdAt。
    # ⚠️ 不打开的话，查出来的驼峰字段全是 null，而且不报错 —— 最难查的那种。
    map-underscore-to-camel-case: true

    # 把执行的 SQL 打到控制台，开发阶段开着，能一眼看出 SQL 长什么样。
    # 上线前把这行删掉（或者注释掉）。
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    db-config:
      # 逻辑删除：实体里叫 isDeleted 的字段自动参与。
      # 有了这一行，调用 deleteById() 时 MyBatis-Plus 会自动变成
      # UPDATE post SET is_deleted = 1 WHERE id = ?，
      # 查询时自动带上 WHERE is_deleted = 0 —— 你不用手写这两个条件。
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      #
      # 生效范围：MyBatis-Plus 只对「实体里真实存在的字段」动手 ——
      #    post / comment 的实体里有 isDeleted，所以受这三行管；
      #    user / category / post_like / post_favorite 没有这个字段，不受影响
      #    （点赞、收藏的取消是真的 DELETE，见 LikeService.toggle 的注释）。
      #
      # ⚠️ 另外要小心 user 表上的唯一键 uk_user_username：
      #    如果哪天 user 也加了逻辑删除，注销过的用户名会永远注册不回来 ——
      #    查重时被 is_deleted = 0 挡掉（看起来没这个人），
      #    插入时又被唯一键挡掉（数据库里那行还在）。
      #    真要做注销功能，唯一键改成 (username, is_deleted)，或者干脆硬删。

  # 以后要写自定义 XML 时，放到 src/main/resources/mapper/ 下面，再把下面这行放开。
  # 现在没这个目录，先留着注释，免得启动时找不到路径反而报错。
  # mapper-locations: classpath*:/mapper/**/*.xml

